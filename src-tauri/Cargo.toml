[package]
name = "nexexplorer"
version = "0.1.0"
description = "NexExplorer — A fast, lightweight file manager"
authors = ["you"]
edition = "2021"

[lib]
name = "nexexplorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
lazy_static = "1"
filetime = "0.2"
trash = "5"
chrono = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
walkdir = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
