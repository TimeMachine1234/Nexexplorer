[package]
name = "nexexplorer"
version = "0.1.0"
description = "NexExplorer — A fast, lightweight file manager"
authors = ["you"]
edition = "2021"

[lib]
name = "nexexplorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
lazy_static = "1"
filetime = "0.2"
trash = "5"
chrono = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
rayon = "1"
crossbeam-channel = "0.5"
memmap2 = "0.9"
crc32fast = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.48", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_System_Ioctl",
  "Win32_System_IO",
  "Win32_System_Registry",
] }
windows = { version = "0.61", features = [
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Foundation",
] }
raw-window-handle = "0.6"
window-vibrancy = "0.5"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

# Image decoding is heavy SIMD work — compile at full speed even in dev
# so the preview panel stays snappy during development.
[profile.dev.package.image]
opt-level = 3
